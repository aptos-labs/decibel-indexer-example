[package]
name = "decibel-indexer-example"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.75"
aptos-indexer-processor-sdk = { git = "https://github.com/aptos-labs/aptos-indexer-processor-sdk", branch = "main" }
async-trait = "0.1.73"
tokio = { version = "1.32.0", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["json", "env-filter"] }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.105"
serde_yaml = "0.9.25"
clap = { version = "4.0", features = ["derive"] }